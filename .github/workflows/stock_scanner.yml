name: VN-Stock Full Market Quant Screener

on:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '10 8 * * 1-5'

  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt thư viện từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy bộ quét định lượng toàn thị trường
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_VOL_MA20: '100000'
          MIN_VAL_BIL: '2.0'
          MIN_PRICE_VND: '5.0'
          MAX_WORKERS: '16'
          MAX_DISPLAY_ROWS: '40'
        run: |
          python vn_stock_scanner.py

      - name: Tải lên file kết quả CSV (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan_results_latest.csv
          if-no-files-found: ignore
          retention-days: 14
